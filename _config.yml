title: Diovandi
description: "Mechanical engineering, computational design, and practical software."
url: "https://diovandi.com"
baseurl: ""
lang: en
timezone: Asia/Jakarta

author:
  name: Diovandi
  url: "https://github.com/diovandi"

permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates
  - vendor
