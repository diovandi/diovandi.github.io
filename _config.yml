title: Diovandi Basheera Putra
tagline: Applied AI and Mechatronics Engineer
description: "Mechatronics engineer in Doha and South Tangerang building applied AI for engineering documents and data, grounded in PLC, control systems and mechanical design."
url: "https://diovandi.com"
baseurl: ""
lang: en
locale: en_US
timezone: Asia/Qatar

author:
  name: Diovandi Basheera Putra
  url: "https://diovandi.com/about/"
  twitter: diovndi

# Default social-share image (1200 x 630); set per page in `defaults` below.
image: /assets/images/og-card.png

social:
  name: Diovandi Basheera Putra
  links:
    - https://www.linkedin.com/in/diovandi/
    - https://github.com/diovandi
    - https://x.com/diovndi

twitter:
  username: diovndi
  card: summary_large_image

# Paste the token from Google Search Console (HTML tag method) here.
# google_site_verification: ""

permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/og-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      seo:
        type: CreativeWork
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      seo:
        type: ScholarlyArticle

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTENT_CHECKLIST.md
  - LICENSE.md
  - templates
  - vendor
