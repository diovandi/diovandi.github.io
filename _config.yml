title: Diovandi Basheera Putra
description: "Mechatronics, aerospace systems, computational engineering, and practical software."
url: "https://diovandi.com"
baseurl: ""
lang: en
timezone: Asia/Jakarta

author:
  name: Diovandi Basheera Putra
  url: "https://github.com/diovandi"

permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates
  - vendor
