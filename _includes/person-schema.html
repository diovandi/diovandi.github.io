<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/#person",
  "name": "{{ site.author.name }}",
  "alternateName": "Diovandi",
  "givenName": "Diovandi Basheera",
  "familyName": "Putra",
  "jobTitle": "Applied AI and Mechatronics Engineer",
  "description": {{ site.description | jsonify }},
  "url": "{{ site.url }}/",
  "image": "{{ '/assets/images/photos/headshot-640.webp' | absolute_url }}",
  {% if site.data.profile.email %}"email": "mailto:{{ site.data.profile.email }}",{% endif %}
  "nationality": { "@type": "Country", "name": "Indonesia" },
  "homeLocation": [
    { "@type": "Place", "name": "Doha, Qatar" },
    { "@type": "Place", "name": "South Tangerang, Indonesia" }
  ],
  "alumniOf": [
    { "@type": "CollegeOrUniversity", "name": "Swiss German University", "url": "https://sgu.ac.id" },
    { "@type": "CollegeOrUniversity", "name": "Fachhochschule Südwestfalen", "url": "https://www.fh-swf.de" },
    { "@type": "CollegeOrUniversity", "name": "Delft University of Technology", "url": "https://www.tudelft.nl" }
  ],
  "knowsAbout": [
    "Applied artificial intelligence",
    "Document AI",
    "Human-in-the-loop AI",
    "Mechatronics",
    "PLC programming",
    "Industrial automation",
    "Control systems",
    "Mechanical design",
    "CAD",
    "Kinematic screw theory",
    "ROS 2",
    "Python",
    "Retrieval-augmented generation",
    "Cloudflare Workers",
    "Google Cloud",
    "Live video production",
    "OBS Studio",
    "Documentary filming",
    "3D printing"
  ],
  "knowsLanguage": ["English", "Indonesian", "German"],
  "sameAs": [
    "{{ site.data.profile.linkedin_url }}",
    "{{ site.data.profile.github_url }}",
    "{{ site.data.profile.x_url }}"
  ]
}
</script>
