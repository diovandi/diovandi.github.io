<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f0e8">
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      })();
    </script>
    {% seo %}
    {% feed_meta %}
    {% assign asset_version = site.time | date: "%s" %}
    <link rel="preload" href="{{ '/assets/fonts/manrope-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_version | url_encode }}">
  </head>
  <body id="top">
    {% include header.html %}
    <main id="content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_version | url_encode }}" defer></script>
  </body>
</html>
