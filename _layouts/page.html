---
layout: default
---
<article class="page-shell shell">
  <header class="page-header">
    {% if page.eyebrow %}<p class="kicker">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
